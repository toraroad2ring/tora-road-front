name: Deploy WordPress Plugin

on:
  push:
    branches:
      - main
    paths:
      - "wordpress-plugin/**"
      - ".github/workflows/deploy-wordpress-plugin.yml"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check PHP syntax
        run: |
          php -l wordpress-plugin/tora-road-meta/tora-road-meta.php

      - name: Show GitHub repository IDs
        run: |
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "GITHUB_REPOSITORY_ID=$GITHUB_REPOSITORY_ID"
          echo "GITHUB_REPOSITORY_OWNER=$GITHUB_REPOSITORY_OWNER"
          echo "GITHUB_REPOSITORY_OWNER_ID=$GITHUB_REPOSITORY_OWNER_ID"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::225874123904:role/tora-road-github-actions-role
          aws-region: ap-northeast-1