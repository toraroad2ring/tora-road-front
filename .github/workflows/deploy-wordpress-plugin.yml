name: Deploy WordPress Plugin

on:
  push:
    branches:
      - main
    paths:
      - "wordpress-plugin/**"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check PHP syntax
        run: |
          php -l wordpress-plugin/tora-road-meta/tora-road-meta.php

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::225874123904:role/tora-road-github-actions-role
          aws-region: ap-northeast-1

      - name: Upload plugin to S3
        run: |
          aws s3 cp \
            wordpress-plugin/tora-road-meta/tora-road-meta.php \
            s3://tora-road-images/deploy/tora-road-meta.php

      - name: Create SSM command parameters
        run: |
          cat > ssm-params.json <<'EOF'
          {
            "commands": [
              "set -e",
              "aws s3 cp s3://tora-road-images/deploy/tora-road-meta.php /tmp/tora-road-meta.php",
              "php -l /tmp/tora-road-meta.php",
              "sudo cp /tmp/tora-road-meta.php /var/www/html/wp-content/plugins/tora-road-meta.php",
              "sudo chown apache:apache /var/www/html/wp-content/plugins/tora-road-meta.php",
              "sudo chmod 644 /var/www/html/wp-content/plugins/tora-road-meta.php",
              "php -l /var/www/html/wp-content/plugins/tora-road-meta.php"
            ]
          }
          EOF

      - name: Deploy plugin with SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09c032cfab82c4ff9" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-09c032cfab82c4ff9"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-09c032cfab82c4ff9" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}"