name: Deploy WordPress Plugin

on:
  push:
    branches:
      - main
    paths:
      - "wordpress-plugin/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check PHP syntax
        run: |
          php -l wordpress-plugin/tora-road-meta/tora-road-meta.php

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload plugin to EC2
        run: |
          scp \
            wordpress-plugin/tora-road-meta/tora-road-meta.php \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/tora-road-meta.php"

      - name: Deploy plugin on EC2
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'
            sudo cp /tmp/tora-road-meta.php \
              /var/www/html/wp-content/plugins/tora-road-meta.php

            sudo chown apache:apache \
              /var/www/html/wp-content/plugins/tora-road-meta.php

            sudo chmod 644 \
              /var/www/html/wp-content/plugins/tora-road-meta.php

            php -l \
              /var/www/html/wp-content/plugins/tora-road-meta.php
          EOF